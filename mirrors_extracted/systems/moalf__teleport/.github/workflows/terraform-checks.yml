name: Terraform Checks

on:
  pull_request:
    paths:
      - 'auth0/**/*.tf'
  workflow_dispatch:

env:
  TF_VAR_auth0_domain: ${{ secrets.AUTH0_DOMAIN }}
  TF_VAR_auth0_client_id: ${{ secrets.AUTH0_CLIENT_ID }}
  TF_VAR_auth0_client_secret: ${{ secrets.AUTH0_CLIENT_SECRET }}

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth0
    strategy:
      matrix:
        directory: [tenant]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: hashicorp/setup-terraform@v3

      - name: Format
        working-directory: auth0/${{ matrix.directory }}
        run: terraform fmt -check

      - name: Validate
        working-directory: auth0/${{ matrix.directory }}
        run: |
          terraform init -backend=false
          terraform validate
