name: Tenant Configuration

on:
  push:
    branches: [ main ]
    paths:
      - 'auth0/tenant/**'
      - '.github/workflows/tenant-configuration.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'auth0/tenant/**'
      - '.github/workflows/tenant-configuration.yml'
  workflow_dispatch:

env:
  TF_VAR_auth0_domain: ${{ secrets.AUTH0_DOMAIN }}
  TF_VAR_auth0_client_id: ${{ secrets.AUTH0_CLIENT_ID }}
  TF_VAR_auth0_client_secret: ${{ secrets.AUTH0_CLIENT_SECRET }}

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./auth0/tenant
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Init
        run: terraform init -backend=false

      - name: Plan
        id: plan
        # Only on pushes to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform plan -input=false -out=plan.tfout

      - name: Apply
        # Only on pushes to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false plan.tfout
