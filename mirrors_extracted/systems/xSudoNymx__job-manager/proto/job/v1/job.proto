syntax = "proto3";

package job.v1;

option go_package = "github.com/xSudoNymx/job-manager/gen/jobpb;jobpb";

service JobService{
  rpc Start(StartRequest) returns (StartResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc StreamOutput(StreamOutputRequest) returns (stream Output);
}

message JobSpec {
  string exe = 1;
  repeated string args = 2;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_RUNNING = 1;
  JOB_STATE_STOPPING = 2;
  JOB_STATE_STOPPED = 3;
  JOB_STATE_EXITED = 4;
}

message JobStatus {
  string job_id = 1;
  int64 pid = 2;
  JobState state = 3;

  // Unix nano timestamps (UTC)
  int64 started_at = 4;
  int64 ended_at = 5;

  int32 exit_code = 6;

  // String errors
  string wait_err = 7;
}

message StartRequest {
  JobSpec spec = 1;
}

message StartResponse {
  string job_id = 1;
}

message StopRequest {
  string job_id = 1;
}

message StopResponse {}

message StatusRequest {
  string job_id = 1;
}

message StatusResponse {
  JobStatus status = 1;
}

enum StreamTag {
  STREAM_TAG_UNSPECIFIED = 0;
  STREAM_TAG_STDOUT = 1;
  STREAM_TAG_STDERR = 2;
}

message Output {
  StreamTag tag = 1;
  bytes data = 2;
}

message StreamOutputRequest {
  string job_id = 1;
}
